[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "luna-mcp"
version = "0.1.0"
description = "FastMCP AI Tool Interface for Luna AI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "shared",
    "ai",
    "fastmcp>=0.1.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "redis>=5.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

