[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "luna-api"
version = "0.1.0"
description = "FastAPI primary application server for Luna AI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "shared",
    "ai",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "redis>=5.0.0",
    "arq>=0.25.0",
    "qdrant-client>=1.9.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

