[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai"
version = "0.1.0"
description = "AI domain abstractions, provider interfaces, RAG, and AI orchestration for Luna AI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "shared",
    "pydantic>=2.0.0",
    "qdrant-client>=1.9.0",
    "httpx>=0.25.0",
    "edge-tts>=6.1.9",
]

[tool.setuptools.package-dir]
ai = "."
